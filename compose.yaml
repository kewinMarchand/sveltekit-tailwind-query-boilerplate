services:
  web:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      MAINTENANCE: ${MAINTENANCE:-0}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      PUBLIC_GLITCHTIP_DSN: ${PUBLIC_GLITCHTIP_DSN:-}
      PUBLIC_GLITCHTIP_ENVIRONMENT: ${PUBLIC_GLITCHTIP_ENVIRONMENT:-}
      PUBLIC_MATOMO_URL: ${PUBLIC_MATOMO_URL:-}
      PUBLIC_MATOMO_SITE_ID: ${PUBLIC_MATOMO_SITE_ID:-}
